name: Release

# Publishes the package to npm and creates the GitHub Release. Two ways to start it:
#   1. Push a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
#   2. Actions → Release → "Run workflow" on `main` with the version (e.g. 0.1.0); the job creates
#      the `vX.Y.Z` tag itself. Works from the GitHub mobile app.
# Either way the version must equal `package.json`. Publishing uses npm Trusted Publishing: npmjs.com
# trusts this workflow (repository numikel/agent-evaluator, workflow release.yml) through an OIDC
# token, so there is no npm token secret and no staged publish to approve. `id-token: write` lets the
# job request that token (it also signs the provenance statement); `contents: write` creates the tag
# and the GitHub Release (github-release.yml, with the version's CHANGELOG.md section as notes).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal package.json (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check that npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - name: Check that the requested version matches package.json
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          requested="${REQUESTED#v}"
          if [ "${version}" != "${requested}" ]; then
            echo "requested ${requested} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Check that CHANGELOG.md has a section for the version
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > /dev/null
      - name: Create the version tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists; publishing from it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "agent-evaluator ${VERSION}"
            git push origin "v${VERSION}"
          fi
      - run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ needs.publish.outputs.version }}
