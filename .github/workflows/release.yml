name: Release

# Publishes the package to npm. Two ways to start it:
#   1. Push a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
#   2. Actions → Release → "Run workflow" on `main` with the version (e.g. 0.1.0); the job creates
#      the `vX.Y.Z` tag itself. Works from the GitHub mobile app.
# Either way the version must equal `package.json`. Requires the `NPM_TOKEN` repository secret (an
# npm granular token with publish rights and 2FA bypass), added under Settings → Secrets and
# variables → Actions. `--provenance` needs `id-token: write`; creating the tag needs `contents: write`.
# With such a token npm *stages* the publish: the job ends green, but the version goes live only after a
# maintainer approves it (npmjs.com → package → Staged Packages, or `npm stage approve <id>`).
# Configuring Trusted Publishing for this workflow on npmjs.com removes both the token and that step.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal package.json (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check that the requested version matches package.json
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          requested="${REQUESTED#v}"
          if [ "${version}" != "${requested}" ]; then
            echo "requested ${requested} does not match package.json version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Create the version tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists; publishing from it"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "agent-evaluator ${VERSION}"
            git push origin "v${VERSION}"
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
