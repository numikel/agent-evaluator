version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      langchain:
        patterns: ["langchain", "@langchain/*"]
      dev-tooling:
        dependency-type: development
    ignore:
      # Playwright minor bumps change the bundled Chromium revision; review them deliberately.
      - dependency-name: playwright
        update-types: ["version-update:semver-minor"]
      # unpdf 2 requires Node.js >= 24 while this package supports >= 22.13; lift when Node 22 is dropped.
      - dependency-name: unpdf
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
