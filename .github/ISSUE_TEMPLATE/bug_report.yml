name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agent-evaluator init
        2. agent-evaluator run invoice-export-september
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-evaluator version
      placeholder: output of `agent-evaluator --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: e.g. Node 24.x on macOS 15
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `agent-evaluator doctor`
      description: Remove anything you consider sensitive. Key values are never printed by the tool.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, `run.json` or `verdict.json` excerpts
      render: text
